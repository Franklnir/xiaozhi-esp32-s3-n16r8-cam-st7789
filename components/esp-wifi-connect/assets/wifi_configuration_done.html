<!DOCTYPE html>
<html>
<head>
    <title>WiFi Configuration</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        :root {
            --bg: #0A0A0A;
            --surface: #141414;
            --border: #FFE600;
            --accent: #FFE600;
            --text: #F5F5F0;
            --text-muted: #A3A3A3;
            --success: #00E676;
            --shadow: 4px 4px 0px #FFE600;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            overflow: hidden;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--surface);
            border: 2px solid var(--border);
            box-shadow: var(--shadow);
            border-radius: 8px;
            padding: 32px 24px;
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--accent);
            color: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 2px 2px 0 #FFF;
        }
        .icon svg {
            width: 36px;
            height: 36px;
            stroke: #000;
            stroke-width: 2.5;
            fill: none;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 8px;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 3.5;
            stroke: #00E676;
            stroke-miterlimit: 10;
            margin: 0 auto 20px;
            filter: drop-shadow(0 0 16px rgba(0, 230, 118, 0.7));
        }
        .checkmark__circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3.5;
            stroke-miterlimit: 10;
            stroke: #00E676;
            fill: rgba(0, 230, 118, 0.15);
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }
        .checkmark__check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #00E676;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }
        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        .message {
            margin-top: 10px;
        }
        .message p.primary {
            font-size: 19px;
            font-weight: 800;
            color: #FFFFFF;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0 0 10px;
        }

        p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" stroke-width="2"/>
                <path class="checkmark__check" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>

            <div class="message">
                <p class="primary" id="message">Configuration Successful!</p>
                <p style="font-size: 12px; color: #00E676; margin-top: 6px;">✓ Wi-Fi Connected & Saved</p>
            </div>
        </div>
    </div>
    
    <script>
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const message = params.get('message') || 'Configuration successful!';
            document.title = message;
            document.getElementById('message').textContent = message;

            // Send exit request after a short delay
            setTimeout(function() {
                fetch('/exit', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Exit config mode request sent');
                    } else {
                        console.error('Failed to send exit request');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }, 1000);
        });
    </script>
</body>
</html>
